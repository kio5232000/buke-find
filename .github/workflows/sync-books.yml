name: Sync official Buke books
on:
  workflow_dispatch:
  schedule:
    - cron: '23 1 * * 1'
  push:
    paths:
      - 'scripts/sync_books.py'
      - '.github/workflows/sync-books.yml'
permissions:
  contents: write
concurrency:
  group: buke-booklist-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out project
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch official published list (one download only)
        run: python scripts/sync_books.py
      - name: Commit only verified booklist updates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/books.json
          git diff --cached --quiet && exit 0
          git commit -m 'Update published Buke booklist'
          git push